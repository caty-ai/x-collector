# GITHUB_TOKEN-created Releases do not fire a release event.
# Use workflow_run after the release-sync carrier completes.
# Precedent: repo-state.yml uses the same carrier completion trigger.
name: release-contributors

on:
  workflow_run:
    workflows: [release-sync]
    types: [completed]

permissions: {}
concurrency:
  group: release-contributors-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  contributors:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Thank external contributors in the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9] ]]; then
            echo '::warning::Carrier ref is not a version tag; skipping release credits.'
            exit 0
          fi
          # Twin of caty-ai/.github external-input-watch.yml:
          # case-insensitive; identical token set, publication-safe spelling.
          fam_roster="sho""jikumaru caty2 alec-bridge alpha-mbp-bridge cero-bridge"
          release=''
          for attempt in 1 2 3 4 5; do
            if release=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG"); then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo '::warning::Release unavailable after 5 lookup attempts; skipping release credits.'
              exit 0
            fi
            sleep 10
          done
          RELEASE_ID=$(jq -r '.id' <<< "$release")
          if jq -e '(.body // "") | test("(?m)^## Contributors[ \\t\\r]*$")' <<< "$release" > /dev/null; then
            exit 0
          fi

          # Previous published release tag; the first release credits all history.
          published_at=$(jq -r '.published_at' <<< "$release")
          releases=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")
          previous_tag=$(jq -r --arg date "$published_at" --arg tag "$RELEASE_TAG" '
            [ .[][] | select(.draft == false and .published_at != null)
              | select(.published_at < $date and .tag_name != $tag) ]
            | sort_by(.published_at) | last | .tag_name // empty
          ' <<< "$releases")
          tag_uri=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
          if [[ -n "$previous_tag" ]]; then
            previous_uri=$(jq -rn --arg tag "$previous_tag" '$tag | @uri')
            commits=$(gh api --paginate --slurp "repos/$GH_REPO/compare/$previous_uri...$tag_uri?per_page=100")
            authors=$(jq '[.[] | .commits[] | .author | select(. != null)]' <<< "$commits")
          else
            commits=$(gh api --paginate --slurp "repos/$GH_REPO/commits?sha=$tag_uri&per_page=100")
            authors=$(jq '[.[][] | .author | select(. != null)]' <<< "$commits")
          fi
          # Author data remains data: never interpolate it into shell source.
          export AUTHORS_JSON="$authors"
          contributors=$(jq -rn --arg roster "$fam_roster" '
            ($roster | ascii_downcase | split(" ")) as $family
            | [env.AUTHORS_JSON | fromjson | .[]
                | select(.type == "User") | .login | ascii_downcase
                | select(endswith("[bot]") | not)
                | select(. as $login | $family | index($login) | not)]
            | unique | map("- @" + .) | join("\n")
          ')
          if [[ -z "$contributors" ]]; then
            exit 0
          fi

          # Re-read just before editing to preserve the latest release-sync body.
          release=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")
          if jq -e '(.body // "") | test("(?m)^## Contributors[ \\t\\r]*$")' <<< "$release" > /dev/null; then
            exit 0
          fi
          notes_file="$RUNNER_TEMP/supporter-release-notes.md"
          jq -j '.body // ""' <<< "$release" > "$notes_file"
          printf '\n\n## Contributors\n\nThank you for your contributions to this release!\n\n%s\n' "$contributors" >> "$notes_file"
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --notes-file "$notes_file"
