name: Community sources verification

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "data/community-sources/**"
      - "package.json"
      - ".github/workflows/**"

permissions:
  contents: read

# This workflow runs PR-authored code by design. It has read-only contents permission and no secrets.
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: x_collector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d x_collector_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/x_collector_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run typecheck:community
      - run: npm run validate:community
      - run: npm run test:community
      - name: Reject Actions expressions inside run blocks
        run: |
          awk '
            /^[[:space:]]*run:[[:space:]]*\|/ { in_run = 1; indent = match($0, /[^ ]/) - 1; next }
            in_run && match($0, /[^ ]/) - 1 <= indent { in_run = 0 }
            /^[[:space:]]*run:[[:space:]]*[^|]/ && /[$][{][{]/ { bad = 1 }
            in_run && /[$][{][{]/ { bad = 1 }
            END { exit bad }
          ' .github/workflows/community-sources.yml .github/workflows/community-sources-verify.yml
