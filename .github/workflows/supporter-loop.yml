# SECURITY: Never checkout code in this caller.
# pull_request_target runs with secrets; keep this caller thin.
# @main follows external-input-caller.yml; central main is merge-only via reviewed PR.
# mode is the only line that changes at owner checkpoint #4.
# The owner registers secrets at checkpoint #2.
name: supporter-loop
on:
  watch:
    types: [started]
  issues:
    types: [opened]
  discussion:
    types: [created]
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "17 3,15 * * *"   # sweep twice daily, 03:17 and 15:17 UTC (contract v2.0 §11; catch-up needs caty-ai/.github child B on main)
  workflow_dispatch:       # sweep on demand (write access to the caller repo required — v2.0 wording); same steps as the schedule, no inputs
permissions:
  contents: write        # ceiling only (v1.11): materialized solely by the sweep-only `stars` job (§4.4); decide/act stay contents: none
  actions: read          # sweep precondition: "no failed supporter-loop runs since last sweep" (§11)
  issues: write
  pull-requests: write
  discussions: write
# Load-bearing: two lanes per source repo (contract v2.0, §4.3 / §16). Event runs
# serialize among themselves so two deliveries of the same event cannot both miss
# the comment marker (§7). The sweep has its own lane so a burst of Stars can
# never cancel the pending sweep (GitHub keeps one running + one pending run per
# group and cancels the rest). Do not delete, do not merge the lanes.
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('supporter-loop-sweep-{0}', github.repository) || format('supporter-loop-{0}', github.repository) }}
  cancel-in-progress: false
jobs:
  loop:
    uses: caty-ai/.github/.github/workflows/supporter-loop-reusable.yml@main
    with:
      mode: live                 # <- the ONLY line that changes at checkpoint #4
      sweep: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    secrets:
      SUPPORTER_LEDGER_TOKEN: ${{ secrets.SUPPORTER_LEDGER_TOKEN }}
      SUPPORTER_LOOP_TOKEN: ${{ secrets.SUPPORTER_LOOP_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
