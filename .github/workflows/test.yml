name: Test (push to main)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Each main push gets a unique group, so nothing on main is cancelled or replaced.
  group: ${{ github.workflow }}-${{ github.run_id }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: make test

  # Same suite on macOS (handbook#54): every dev machine is macOS while
  # ubuntu-only CI structurally misses BSD/GNU behavior differences.
  # Separate job name keeps the existing required check `test` intact.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: make test
