<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="X Collector pipeline: collect from seven platforms, refine with LLM classification, publish a daily edition for people and a feed API for agents, with a self-maintaining source lifecycle.">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8A8577"/>
    </marker>
    <marker id="arwAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9C2B22"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="#F7F5F0"/>

  <!-- masthead -->
  <text x="64" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#16171A">X Collector</text>
  <text x="64" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#5F5B52">One information base, read by people and by agents alike</text>
  <line x1="64" y1="134" x2="1216" y2="134" stroke="#16171A" stroke-width="2"/>
  <line x1="64" y1="140" x2="1216" y2="140" stroke="#16171A" stroke-width="0.8"/>

  <!-- ============ COLLECT ============ -->
  <rect x="64" y="182" width="246" height="212" fill="none" stroke="#16171A" stroke-width="1.4"/>
  <rect x="64" y="182" width="246" height="34" fill="#16171A"/>
  <text x="80" y="205" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="2.4" fill="#F7F5F0">COLLECT</text>
  <text x="80" y="246" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F">X (Twitter)</text>
  <text x="80" y="270" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F">Instagram</text>
  <text x="80" y="294" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F">Facebook</text>
  <text x="80" y="318" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F">Reddit</text>
  <text x="196" y="246" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F">Qiita</text>
  <text x="196" y="270" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F">GitHub</text>
  <text x="196" y="294" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F">RSS</text>
  <text x="196" y="318" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F">YouTube</text>
  <text x="80" y="360" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7568">twice daily · 1,000+ items/day</text>

  <line x1="322" y1="288" x2="368" y2="288" stroke="#8A8577" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ REFINE ============ -->
  <rect x="382" y="182" width="316" height="212" fill="none" stroke="#16171A" stroke-width="1.4"/>
  <rect x="382" y="182" width="316" height="34" fill="#16171A"/>
  <text x="398" y="205" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="2.4" fill="#F7F5F0">REFINE</text>
  <text x="398" y="248" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F"><tspan font-weight="bold">Step 0</tspan>  normalize &amp; de-duplicate</text>
  <text x="398" y="278" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F"><tspan font-weight="bold">Step 1–3</tspan>  LLM classification</text>
  <text x="398" y="308" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F"><tspan font-weight="bold">Step 4</tspan>  cross-link follow-ups</text>
  <text x="398" y="338" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F"><tspan font-weight="bold">Step 6</tspan>  aggregate market voice</text>
  <text x="398" y="372" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7568">11 primary + 15 sub categories</text>

  <line x1="710" y1="288" x2="756" y2="288" stroke="#8A8577" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ PUBLISH ============ -->
  <rect x="770" y="182" width="204" height="212" fill="none" stroke="#16171A" stroke-width="1.4"/>
  <rect x="770" y="182" width="204" height="34" fill="#16171A"/>
  <text x="786" y="205" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="2.4" fill="#F7F5F0">PUBLISH</text>
  <text x="786" y="250" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F"><tspan font-weight="bold">Step 5</tspan>  typeset</text>
  <text x="786" y="278" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F">13-section edition</text>
  <text x="786" y="306" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F">every morning</text>
  <text x="786" y="348" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7568">ranked by source</text>
  <text x="786" y="366" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7568">trust, not by buzz</text>

  <line x1="986" y1="288" x2="1024" y2="248" stroke="#8A8577" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="986" y1="288" x2="1024" y2="330" stroke="#8A8577" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- ============ OUTPUTS ============ -->
  <rect x="1034" y="196" width="182" height="80" fill="none" stroke="#16171A" stroke-width="1.4"/>
  <text x="1050" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16171A">For people</text>
  <text x="1050" y="250" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7568">a newspaper you read</text>
  <text x="1050" y="266" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7568">over breakfast</text>

  <rect x="1034" y="300" width="182" height="80" fill="none" stroke="#16171A" stroke-width="1.4"/>
  <text x="1050" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#16171A">For agents</text>
  <text x="1050" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7568">Feed API + MCP server</text>
  <text x="1050" y="370" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#7A7568">same data, typed tools</text>

  <!-- ============ SOURCE LIFECYCLE LOOP ============ -->
  <line x1="64" y1="446" x2="1216" y2="446" stroke="#D6D2C7" stroke-width="1"/>
  <text x="64" y="486" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#9C2B22">The source list maintains itself</text>

  <text x="64" y="524" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F">discover candidates</text>
  <line x1="206" y1="519" x2="248" y2="519" stroke="#9C2B22" stroke-width="1.4" marker-end="url(#arwAccent)"/>
  <text x="262" y="524" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F">LLM scores them</text>
  <line x1="386" y1="519" x2="428" y2="519" stroke="#9C2B22" stroke-width="1.4" marker-end="url(#arwAccent)"/>
  <text x="442" y="524" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#9C2B22">you approve, weekly</text>
  <line x1="600" y1="519" x2="642" y2="519" stroke="#9C2B22" stroke-width="1.4" marker-end="url(#arwAccent)"/>
  <text x="656" y="524" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F">promoted into collection</text>
  <line x1="854" y1="519" x2="896" y2="519" stroke="#9C2B22" stroke-width="1.4" marker-end="url(#arwAccent)"/>
  <text x="910" y="524" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3A382F">decayed sources retire</text>

  <path d="M 1120 534 L 1120 566 L 150 566 L 150 540" fill="none" stroke="#9C2B22" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwAccent)"/>
  <text x="592" y="588" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9C2B22">every day</text>

  <text x="64" y="614" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A7568">Nothing is auto-approved. The only recurring human task is a few minutes of review each week.</text>
</svg>
